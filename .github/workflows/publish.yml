name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Minecraft ${{ matrix.minecraft }} (${{ matrix.loader }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.18.2"
            loader: fabric
            gradle_task: ":1.18.2-fabric:build"
          - minecraft: "1.18.2"
            loader: forge
            gradle_task: ":1.18.2-forge:build"
          - minecraft: "1.19.2"
            loader: fabric
            gradle_task: ":1.19.2-fabric:build"
          - minecraft: "1.19.2"
            loader: forge
            gradle_task: ":1.19.2-forge:build"
          - minecraft: "1.20.1"
            loader: fabric
            gradle_task: ":1.20.1-fabric:build"
          - minecraft: "1.20.1"
            loader: forge
            gradle_task: ":1.20.1-forge:build"
          - minecraft: "1.21.1"
            loader: fabric
            gradle_task: ":1.21.1-fabric:build"
          - minecraft: "1.21.1"
            loader: neoforge
            gradle_task: ":1.21.1-neoforge:build"
          - minecraft: "1.21.11"
            loader: fabric
            gradle_task: ":1.21.11-fabric:build"
          - minecraft: "1.21.11"
            loader: neoforge
            gradle_task: ":1.21.11-neoforge:build"
          - minecraft: "26.1.2"
            loader: fabric
            gradle_task: ":26.1.2-fabric:build"
          - minecraft: "26.1.2"
            loader: neoforge
            gradle_task: ":26.1.2-neoforge:build"
          - minecraft: "26.2"
            loader: fabric
            gradle_task: ":26.2-fabric:build"
          - minecraft: "26.2"
            loader: neoforge
            gradle_task: ":26.2-neoforge:build"

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build artifacts
        run: ./gradlew ${{ matrix.gradle_task }}

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*.jar

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: none

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: ForgedLead ${{ github.event.release.tag_name || inputs.tag }} / Minecraft ${{ matrix.minecraft }}
          version: ${{ github.event.release.tag_name || inputs.tag }}-${{ matrix.minecraft }}-${{ matrix.loader }}
          version-type: release
          changelog: ${{ github.event.release.body || '' }}
          loaders: ${{ matrix.loader }}
          environment: client | server
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none

      - name: Keep jar for GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: versions/${{ matrix.minecraft }}-${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
          # "Re-run failed jobs" keeps artifacts from earlier attempts; a rerun
          # of a job whose upload already happened must not fail on the name.
          overwrite: true

  github-release:
    name: Attach jars to GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true

      # Changes made with GITHUB_TOKEN do not trigger workflows, so creating
      # or editing the release here cannot start another publish run.
      - name: Attach jars to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" jars/*.jar --clobber
          else
            gh release create "$TAG" jars/*.jar --verify-tag \
              --title "ForgedLead $TAG" --generate-notes
          fi
