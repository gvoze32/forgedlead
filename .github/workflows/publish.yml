name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.18.2"
            gradle_tasks: ":1.18.2-fabric:build :1.18.2-forge:build"
            loaders: |
              fabric
              forge
          - minecraft: "1.19.2"
            gradle_tasks: ":1.19.2-fabric:build :1.19.2-forge:build"
            loaders: |
              fabric
              forge
          - minecraft: "1.20.1"
            gradle_tasks: ":1.20.1-fabric:build :1.20.1-forge:build"
            loaders: |
              fabric
              forge
          - minecraft: "1.21.1"
            gradle_tasks: ":1.21.1-fabric:build :1.21.1-neoforge:build"
            loaders: |
              fabric
              neoforge
          - minecraft: "1.21.11"
            gradle_tasks: ":1.21.11-fabric:build :1.21.11-neoforge:build"
            loaders: |
              fabric
              neoforge
          - minecraft: "26.1.2"
            gradle_tasks: ":26.1.2-fabric:build :26.1.2-neoforge:build"
            loaders: |
              fabric
              neoforge
          - minecraft: "26.2"
            gradle_tasks: ":26.2-fabric:build :26.2-neoforge:build"
            loaders: |
              fabric
              neoforge

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build artifacts
        run: ./gradlew ${{ matrix.gradle_tasks }}

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: versions/${{ matrix.minecraft }}-*/build/libs/*.jar

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: ForgedLead ${{ github.event.release.tag_name }} / Minecraft ${{ matrix.minecraft }}
          version: ${{ github.event.release.tag_name }}-${{ matrix.minecraft }}
          version-type: release
          changelog: ${{ github.event.release.body }}
          loaders: ${{ matrix.loaders }}
          environment: client | server
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
